name: Deploy SotM 2026 Website to GitHub Pages
on:
  push:
    branches: ["main"] # Change to "master" if your default branch is master
    paths:
      - '2026/Website/**' # Only trigger when changes are made to this specific folder

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Generate session posters manifest
        run: |
          POSTER_DIR="2026/Website/SessionPosters"
          mkdir -p "$POSTER_DIR"
          cd "$POSTER_DIR"
          python3 -c '
          import json, os, subprocess

          files = []
          for name in sorted(os.listdir(".")):
              if name.startswith(".") or name == "manifest.json":
                  continue
              if not os.path.isfile(name):
                  continue
              try:
                  mime = subprocess.check_output(["file", "--mime-type", "-b", name], text=True).strip()
              except Exception:
                  continue
              if mime.startswith("image/"):
                  files.append(name)

          with open("manifest.json", "w") as f:
              json.dump(files, f)
          print("Generated manifest.json:", files)
          '
          cat manifest.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Point to the specific subfolder containing your static HTML
          path: './2026/Website'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

